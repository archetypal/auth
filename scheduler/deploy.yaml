apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi-scheduler
  labels:
    app: fastapi-scheduler
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fastapi-scheduler
  template:
    metadata:
      labels:
        app: fastapi-scheduler
    spec:
      containers:
        - name: api
          image: fastapi-scheduler:0.1.0
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000

---
apiVersion: v1
kind: Service
metadata:
  name: fastapi-scheduler
spec:
  selector:
    app: fastapi-scheduler
  ports:
    - name: http
      port: 80
      targetPort: 8000
